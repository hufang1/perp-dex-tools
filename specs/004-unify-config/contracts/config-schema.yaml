## TradingConfig Schema

```yaml
TradingConfig:
  type: dataclass
  description: Configuration for modular trading bot

  fields:
    exchange:
      type: str
      default: "edgex"
      description: Exchange name
      validation:
        - condition: "in supported exchanges"
          error_message: "Unsupported exchange"

    ticker:
      type: str
      default: "ETH"
      description: Trading pair symbol
      example: "ETH", "BTC"

    contract_id:
      type: str
      default: ""
      description: Contract ID (set at runtime)

    tick_size:
      type: Decimal
      default: 0
      description: Minimum price increment (set at runtime)

    quantity:
      type: Decimal
      default: 0.1
      description: Order quantity
      validation:
        - condition: "> 0"
          error_message: "quantity must be greater than 0"

    take_profit:
      type: Decimal
      default: 0.02
      description: Take profit amount in USDT
      validation:
        - condition: "> 0"
          error_message: "take_profit must be greater than 0"

    direction:
      type: str
      default: "buy"
      description: Trading direction
      allowed_values: ["buy", "sell"]
      validation:
        - condition: "in ['buy', 'sell']"
          error_message: "direction must be 'buy' or 'sell'"

    max_orders:
      type: int
      default: 40
      description: Maximum active orders
      validation:
        - condition: "> 0"
          error_message: "max_orders must be greater than 0"

    wait_time:
      type: int
      default: 450
      description: Wait time between orders in seconds
      validation:
        - condition: "> 0"
          error_message: "wait_time must be greater than 0"

    grid_step:
      type: Decimal
      default: -100
      description: Grid step percentage

    stop_price:
      type: Decimal
      default: -1
      description: Stop trading price (-1 = disabled)

    pause_price:
      type: Decimal
      default: -1
      description: Pause trading price (-1 = disabled)

    boost_mode:
      type: bool
      default: false
      description: Enable boost mode (aster/backpack only)
      validation:
        - condition: "only with aster or backpack exchange"
          error_message: "boost_mode is only supported for aster and backpack exchanges"

    env_file:
      type: str
      default: ".env"
      description: Path to environment variables file
      example: ".env", ".env.production"

  methods:
    from_env:
      return_type: TradingConfig
      description: Create instance from environment variables
```

---

## Validation Error Format

All validation errors should follow this format:

```python
raise ValueError("<parameter_name> <validation_description>")
```

**Examples**:
- `"min_spread_rate must be greater than 0"`
- `"max_holding_time must be greater than time_close_threshold"`
- `"exchange must be one of ['backpack', 'extended', 'apex', 'grvt', 'edgex', 'nado']"`
- `"quantity must be greater than 0"`
- `"boost_mode is only supported for aster and backpack exchanges"`
