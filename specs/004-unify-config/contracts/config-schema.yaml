# Configuration Validation Schema

**Feature**: 004-unify-config | **Date**: 2026-01-09

This document defines the validation rules and schema for all configuration classes.

---

## SpreadArbConfig Schema

```yaml
SpreadArbConfig:
  type: dataclass
  description: Configuration for spread arbitrage bot

  fields:
    # Basic Configuration
    ticker:
      type: str
      default: "ETH"
      description: Trading pair symbol
      example: "ETH", "BTC"

    order_quantity_usdt:
      type: Decimal
      default: 35
      description: Order size in USDT
      validation:
        - condition: "> 0"
          error_message: "order_quantity_usdt must be greater than 0"

    env_file:
      type: str
      default: ".env"
      description: Path to environment variables file
      example: ".env", ".env.account1", ".env.production"

    # Spread Parameters
    min_spread_rate:
      type: Decimal
      default: 0.0005
      description: Minimum spread rate to open position (0.05%)
      validation:
        - condition: "> 0"
          error_message: "min_spread_rate must be greater than 0"
        - condition: "> latency_buffer"
          error_message: "min_spread_rate must be greater than latency_buffer"

    latency_buffer:
      type: Decimal
      default: 0.0001
      description: Buffer for execution latency (0.01%)

    # Position Management
    max_open_pairs:
      type: int
      default: 3
      description: Maximum concurrent spread pairs
      validation:
        - condition: "> 0"
          error_message: "max_open_pairs must be greater than 0"

    max_total_position_usdt:
      type: Decimal
      default: 25
      description: Maximum total position value in USDT

    # Time-Based Closing
    enable_time_close:
      type: bool
      default: true
      description: Enable time-based position closing

    max_holding_time:
      type: int
      default: 300
      description: Maximum position holding time in seconds
      validation:
        - condition: "> time_close_threshold"
          error_message: "max_holding_time must be greater than time_close_threshold"

    time_close_threshold:
      type: int
      default: 60
      description: Time threshold for forced closing in seconds
      validation:
        - condition: "> 0"
          error_message: "time_close_threshold must be greater than 0"

    # Profit-Based Closing
    enable_profit_target:
      type: bool
      default: true
      description: Enable profit target closing

    profit_target_rate:
      type: Decimal
      default: 0.0005
      description: Target profit rate (0.05%)
      validation:
        - condition: "> 0"
          error_message: "profit_target_rate must be greater than 0"

    # Stop Loss
    enable_stop_loss:
      type: bool
      default: true
      description: Enable stop-loss

    stop_loss_usdt:
      type: Decimal
      default: 5
      description: Stop-loss amount in USDT

    # Time Close Profit Threshold
    time_close_profit_threshold:
      type: Decimal
      default: 0.0001
      description: Minimum profit for time-based close (0.01%)

    allow_negative_close:
      type: bool
      default: false
      description: Allow closing with negative profit

    # Risk Control
    max_lighter_depth_ratio:
      type: Decimal
      default: 0.5
      description: Maximum ratio of Lighter depth to use
      validation:
        - condition: "> 0 and <= 1"
          error_message: "max_lighter_depth_ratio must be in (0, 1] range"

    min_lighter_depth_usdt:
      type: Decimal
      default: 200
      description: Minimum Lighter depth required in USDT

    check_depth_layers:
      type: int
      default: 3
      description: Number of orderbook layers to check

    slippage_tolerance:
      type: Decimal
      default: 0.001
      description: Maximum acceptable slippage (0.1%)

    # Unhedged Position Protection
    max_unhedged_positions:
      type: int
      default: 0
      description: Maximum allowed unhedged positions (0 = forbidden)

    auto_close_unhedged:
      type: bool
      default: false
      description: Auto-close unhedged positions

    unhedged_position_timeout:
      type: int
      default: 60
      description: Timeout for unhedged positions in seconds

    # Hedge Failure Monitoring
    hedge_failure_threshold:
      type: Decimal
      default: 0.3
      description: Hedge failure rate threshold (30%)

    hedge_failure_window:
      type: int
      default: 10
      description: Hedge failure rate statistical window

    # Position Reconciliation
    enable_reconciliation:
      type: bool
      default: true
      description: Enable position reconciliation

    reconciliation_interval:
      type: int
      default: 60
      description: Reconciliation interval in seconds

    # Timeouts
    extended_fill_timeout:
      type: int
      default: 10
      description: Extended order fill timeout in seconds

    lighter_hedge_timeout:
      type: int
      default: 3
      description: Lighter hedge timeout in seconds

    # Circuit Breaker
    max_consecutive_failures:
      type: int
      default: 3
      description: Maximum consecutive failures before cooldown

    cooldown_period:
      type: int
      default: 60
      description: Cooldown period in seconds

    # Priority
    prioritize_closing:
      type: bool
      default: true
      description: Prioritize closing over opening

    # Other
    enable_partial_fill:
      type: bool
      default: true
      description: Allow partial order fills

    log_level:
      type: str
      default: "INFO"
      description: Logging level
      allowed_values: ["DEBUG", "INFO", "WARNING", "ERROR"]

  methods:
    from_env:
      return_type: SpreadArbConfig
      description: Create instance from environment variables

    effective_min_spread:
      return_type: Decimal
      description: Returns min_spread_rate + latency_buffer
```

