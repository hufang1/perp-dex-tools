## HedgeConfig Schema

```yaml
HedgeConfig:
  type: dataclass
  description: Configuration for hedge mode bots

  fields:
    exchange:
      type: str
      default: "edgex"
      description: Primary exchange name
      allowed_values: ["backpack", "extended", "apex", "grvt", "edgex", "nado"]
      validation:
        - condition: "in supported list"
          error_message: "exchange must be one of ['backpack', 'extended', 'apex', 'grvt', 'edgex', 'nado']"

    ticker:
      type: str
      default: "BTC"
      description: Trading pair symbol
      example: "BTC", "ETH"

    order_quantity:
      type: Decimal
      default: 0.01
      description: Order size in tokens
      validation:
        - condition: "> 0"
          error_message: "order_quantity must be greater than 0"

    iterations:
      type: int
      default: 20
      description: Number of trading iterations
      validation:
        - condition: "> 0"
          error_message: "iterations must be greater than 0"

    fill_timeout:
      type: int
      default: 5
      description: Order fill timeout in seconds
      validation:
        - condition: "> 0"
          error_message: "fill_timeout must be greater than 0"

    sleep_time:
      type: int
      default: 0
      description: Sleep time between iterations in seconds
      validation:
        - condition: ">= 0"
          error_message: "sleep_time must be non-negative"

    max_position:
      type: Decimal
      default: 0
      description: Maximum position size (0 = unlimited)
      validation:
        - condition: ">= 0"
          error_message: "max_position must be non-negative"

    env_file:
      type: str
      default: ".env"
      description: Path to environment variables file
      example: ".env", ".env.account1"

  methods:
    from_env:
      return_type: HedgeConfig
      description: Create instance from environment variables
```

